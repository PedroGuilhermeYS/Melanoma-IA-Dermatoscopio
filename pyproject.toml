[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "melanoma-ia-dermatoscopio"
version = "1.0.0"
description = "Classificação de lesões de pele para o dermatoscópio de baixo custo. Modelo, API de inferência, orquestrador e GUI de pesquisa com Grad-CAM."
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "CC-BY-NC-4.0" }

dependencies = [
    "timm==1.0.22",
    "pillow==12.0.0",
    "numpy==2.2.6",
    "opencv-python-headless==4.12.0.88",
    "huggingface_hub==0.26.5",
    "requests==2.32.3",
]

[project.optional-dependencies]

api = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-multipart==0.0.20",
]
gui = [
    "PyQt6==6.10.1",
    "pandas==2.3.3",
    "opencv-python==4.12.0.88",
]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "ruff==0.8.4",
]

[tool.setuptools.packages.find]
include = ["melanoma_ia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
